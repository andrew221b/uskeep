  PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=app.uskeep.vickand"
  LEGAL_APPROVED = "true"
  VITE_SUPABASE_URL = "https://byqwauxvnkmgxneaiwji.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Zit9cnOzWLiGQNg8tyuoug_pS73IE-K"

